<div class="page-wrapper" data-init="initHostNewReservation">

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="btn-back" id="btn-back" aria-label="Retour">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Retour
      </button>
    </div>
    <div class="header-left">
      <span class="header-title">Nouvelle réservation</span>
    </div>
    <div class="header-right" style="width:60px;"></div>
  </header>

  <main class="page-content form-page">
    <form id="reservation-form" novalidate>

      <!-- 1. Source -->
      <div class="glass-card form-section">
        <p class="form-section__title">Source</p>
        <div class="form-stack">

          <div class="form-group">
            <label class="form-label" for="input-plateforme">Plateforme</label>
            <select class="select" id="input-plateforme">
              <option value="">— Choisir —</option>
              <option value="Airbnb">Airbnb</option>
              <option value="Booking">Booking.com</option>
              <option value="Abritel">Abritel / VRBO</option>
              <option value="Direct">Réservation directe</option>
              <option value="Autre">Autre</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="input-ref">Référence réservation</label>
            <input class="input" id="input-ref" type="text" placeholder="Ex : HM12345678" autocomplete="off">
          </div>

          <div class="form-group">
            <label class="form-label" for="input-statut-resa">Statut réservation</label>
            <select class="select" id="input-statut-resa">
              <option value="confirmee">Confirmée</option>
              <option value="en_attente">En attente</option>
              <option value="annulee">Annulée</option>
            </select>
          </div>

        </div>
      </div>

      <!-- 2. Voyageur -->
      <div class="glass-card form-section">
        <p class="form-section__title">Voyageur</p>
        <div class="form-stack">

          <div class="form-group">
            <label class="form-label" for="input-client-nom">Nom du voyageur *</label>
            <input class="input" id="input-client-nom" type="text" placeholder="Prénom Nom" required autocomplete="off">
          </div>

          <div class="form-group">
            <label class="form-label" for="input-client-tel">Téléphone</label>
            <input class="input" id="input-client-tel" type="tel" placeholder="+33 6 …" autocomplete="off">
          </div>

          <div class="form-group">
            <label class="form-label">Nombre de voyageurs</label>
            <div class="stepper" role="group" aria-label="Nombre de voyageurs">
              <button type="button" class="stepper__btn" id="step-minus" aria-label="Diminuer" disabled>−</button>
              <div class="stepper__value" id="step-value" aria-live="polite">1</div>
              <button type="button" class="stepper__btn" id="step-plus" aria-label="Augmenter">+</button>
            </div>
          </div>

          <div class="form-group">
            <span class="form-label">Options séjour</span>
            <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px;">
              <label class="toggle-label">
                <span>Animaux de compagnie</span>
                <input type="checkbox" id="toggle-animaux" class="toggle-input">
              </label>
              <label class="toggle-label">
                <span>Lit bébé nécessaire</span>
                <input type="checkbox" id="toggle-lit-bebe" class="toggle-input">
              </label>
            </div>
          </div>

        </div>
      </div>

      <!-- 3. Séjour -->
      <div class="glass-card form-section">
        <p class="form-section__title">Séjour</p>
        <div class="form-stack">

          <div class="date-range">
            <div class="form-group">
              <label class="form-label" for="input-arrivee">Arrivée *</label>
              <input class="input" id="input-arrivee" type="date" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="input-heure-arrivee">Heure</label>
              <input class="input" id="input-heure-arrivee" type="time" value="16:00">
            </div>
          </div>

          <div class="date-range">
            <div class="form-group">
              <label class="form-label" for="input-depart">Départ *</label>
              <input class="input" id="input-depart" type="date" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="input-heure-depart">Heure</label>
              <input class="input" id="input-heure-depart" type="time" value="11:00">
            </div>
          </div>

          <div class="date-summary" id="date-summary" style="display:none;">
            <span class="date-summary__label">Durée du séjour</span>
            <span class="date-summary__value" id="date-nuits">—</span>
          </div>

        </div>
      </div>

      <!-- 4. Intervention -->
      <div class="glass-card form-section">
        <p class="form-section__title">Intervention</p>
        <div class="form-stack">

          <div class="form-group">
            <label class="form-label" for="input-agent">Agent assigné *</label>
            <select class="select" id="input-agent" required>
              <option value="">Chargement…</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="input-date-intervention">Date d'intervention *</label>
            <input class="input" id="input-date-intervention" type="date" required>
          </div>

          <div class="date-range">
            <div class="form-group">
              <label class="form-label" for="input-heure-debut">Début</label>
              <input class="input" id="input-heure-debut" type="time" value="11:00">
            </div>
            <div class="form-group">
              <label class="form-label" for="input-heure-fin">Fin</label>
              <input class="input" id="input-heure-fin" type="time" value="15:00">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="input-type">Type d'intervention</label>
            <select class="select" id="input-type">
              <option value="standard">Standard</option>
              <option value="grand_menage">Grand ménage</option>
              <option value="controle">Contrôle</option>
            </select>
          </div>

        </div>
      </div>

      <!-- 5. Linge -->
      <div class="glass-card form-section">
        <p class="form-section__title">Linge à prévoir</p>
        <div class="form-stack">
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;">
            <div class="form-group">
              <label class="form-label" for="linge-draps">Draps</label>
              <input class="input" id="linge-draps" type="number" min="0" value="0">
            </div>
            <div class="form-group">
              <label class="form-label" for="linge-housses">Housses</label>
              <input class="input" id="linge-housses" type="number" min="0" value="0">
            </div>
            <div class="form-group">
              <label class="form-label" for="linge-taies">Taies</label>
              <input class="input" id="linge-taies" type="number" min="0" value="0">
            </div>
            <div class="form-group">
              <label class="form-label" for="linge-serv-bain">Serv. bain</label>
              <input class="input" id="linge-serv-bain" type="number" min="0" value="0">
            </div>
            <div class="form-group">
              <label class="form-label" for="linge-serv-mains">Serv. mains</label>
              <input class="input" id="linge-serv-mains" type="number" min="0" value="0">
            </div>
            <div class="form-group">
              <label class="form-label" for="linge-tapis">Tapis bain</label>
              <input class="input" id="linge-tapis" type="number" min="0" value="0">
            </div>
            <div class="form-group">
              <label class="form-label" for="linge-torchons">Torchons</label>
              <input class="input" id="linge-torchons" type="number" min="0" value="0">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="linge-autres">Autres</label>
            <input class="input" id="linge-autres" type="text" placeholder="Ex : peignoirs, serviettes piscine…" autocomplete="off">
          </div>
        </div>
      </div>

      <!-- 6. Remarques -->
      <div class="glass-card form-section">
        <p class="form-section__title">Remarques pour l'agent</p>
        <div class="form-stack">
          <div class="form-group">
            <textarea class="textarea" id="input-remarques" placeholder="Codes d'accès, points d'attention, consignes particulières…" rows="4"></textarea>
          </div>
        </div>
      </div>

    </form>

    <div class="form-submit-bar">
      <button type="submit" form="reservation-form" class="btn btn--primary btn--full btn--lg" id="btn-submit">
        Créer la réservation
      </button>
    </div>
  </main>

</div>
