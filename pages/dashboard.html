<div class="page-wrapper" data-init="initDashboard">

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <span class="header-logo">Cleanzr</span>
    </div>
    <div class="header-right">
      <button class="btn-icon-glass" id="btn-theme" aria-label="Changer de thème">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 256 256"><path d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26A106,106,0,0,0,96,56,104.11,104.11,0,0,0,200,160a106,106,0,0,0,14.92-1.06A89,89,0,0,1,188.9,190.34Z"/></svg>
      </button>
      <button class="btn-icon-glass" id="btn-logout" aria-label="Déconnexion">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="page-content">

    <!-- Greeting -->
    <div class="greeting animate-fade-in-up stagger-1">
      <div class="greeting__hello" id="greeting-text">Bonjour 👋</div>
      <div class="greeting__sub" id="greeting-date"></div>
    </div>

    <!-- Stats (hôte uniquement) -->
    <section id="stats-section" class="stats-row animate-fade-in-up stagger-2">
      <div class="glass-card stat-card">
        <span class="stat-value" id="stat-total">—</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="glass-card stat-card">
        <span class="stat-value" id="stat-avenir">—</span>
        <span class="stat-label">À venir</span>
      </div>
      <div class="glass-card stat-card">
        <span class="stat-value" id="stat-terminees">—</span>
        <span class="stat-label">Terminées</span>
      </div>
    </section>

    <!-- Filtres -->
    <div class="filter-row animate-fade-in-up stagger-3">
      <div class="filter-tabs" role="tablist" aria-label="Filtrer les interventions">
        <button class="filter-tab" data-filter="avenir" role="tab" aria-selected="false">À venir</button>
        <button class="filter-tab" data-filter="terminees" role="tab" aria-selected="false">Terminées</button>
        <button class="filter-tab" data-filter="all" role="tab" aria-selected="false">Toutes</button>
      </div>
    </div>

    <!-- Liste interventions -->
    <div id="interventions-list" class="interventions-list animate-fade-in-up stagger-4">
      <div class="page-loading"><div class="spinner"></div></div>
    </div>

  </main>

  <!-- FAB nouvelle réservation (hôte uniquement) -->
  <button id="btn-new" class="fab" hidden aria-label="Nouvelle réservation">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

</div>
