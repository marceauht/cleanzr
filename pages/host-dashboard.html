<div class="page-wrapper" data-init="initHostDashboard">

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <span class="header-logo">Cleanzr</span>
    </div>
    <div class="header-right">
      <span class="header-user" id="header-user"></span>
      <button class="btn btn--icon" id="btn-logout" title="Déconnexion" aria-label="Déconnexion">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Contenu -->
  <main class="page-content">

    <!-- Greeting -->
    <div class="greeting">
      <p class="greeting__hello" id="greeting-text">Bonjour</p>
      <p class="greeting__sub" id="greeting-date"></p>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-value" id="stat-total">—</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-avenir">—</span>
        <span class="stat-label">À venir</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-terminees">—</span>
        <span class="stat-label">Terminées</span>
      </div>
    </div>

    <!-- Filtres -->
    <div class="filter-row">
      <div class="filter-tabs" role="tablist">
        <button class="filter-tab active" data-filter="all"     role="tab" aria-selected="true">Toutes</button>
        <button class="filter-tab"        data-filter="avenir"  role="tab">À venir</button>
        <button class="filter-tab"        data-filter="terminees" role="tab">Terminées</button>
      </div>
    </div>

    <!-- Liste interventions -->
    <div id="interventions-list" class="interventions-list" role="list">
      <div class="page-loading"><div class="spinner"></div></div>
    </div>

  </main>

  <!-- FAB Nouvelle réservation -->
  <button class="fab" id="btn-new" title="Nouvelle réservation" aria-label="Nouvelle réservation">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5"  y1="12" x2="19" y2="12"/>
    </svg>
  </button>

</div>
